name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # rust-toolchain.toml selects the MSVC stable toolchain; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2

      # Release exe: installs the pinned web assets, embeds them, strips build-machine paths.
      - name: Build release
        shell: pwsh
        run: scripts/build-release.ps1

      # Harness build: test code exists only with this feature.
      - name: Build harness
        run: cargo build --features harness

      # Lints: every warning is an error, for the normal build and for the harness build (test code included).
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features harness -- -D warnings

      # Unit tests and release-binary checks. The desktop suites need a real interactive
      # session (hotkeys, mouse, clipboard, WebView2 window) and are run locally.
      - name: Static suite
        shell: pwsh
        run: scripts/test-all.ps1 -Suite static
